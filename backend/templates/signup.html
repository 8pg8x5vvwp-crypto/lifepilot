<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/static/auth.css?v=1">
  <title>LifePilot — Sign Up</title>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">
        <img src="/static/lifepilot-logo.png" alt="LifePilot">
      </div>
      <h1>Create your account</h1>
      <p class="auth-sub">Start organizing your life with LifePilot</p>

      <div id="authError" class="auth-error hidden"></div>

      <form id="signupForm" autocomplete="on">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" minlength="3" required />

        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required />

        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" minlength="6" required />
        <span class="auth-hint">At least 6 characters</span>

        <button type="submit" id="signupBtn">Sign Up</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="/login">Log in</a></p>
    </div>
  </div>

  <script>
    const form = document.getElementById('signupForm');
    const errorBox = document.getElementById('authError');
    const btn = document.getElementById('signupBtn');

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.remove('hidden');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Creating account...';

      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password })
        });
        const data = await res.json();
        if (data.status === 'success') {
          window.location.href = '/';
        } else {
          showError(data.message || 'Sign up failed.');
        }
      } catch (err) {
        showError('Could not connect to server.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign Up';
      }
    });
  </script>
</body>
</html>
