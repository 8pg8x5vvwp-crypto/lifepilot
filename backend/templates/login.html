<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/static/auth.css?v=1">
  <title>LifePilot — Log In</title>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">
        <img src="/static/lifepilot-logo.png" alt="LifePilot">
      </div>
      <h1>Welcome back</h1>
      <p class="auth-sub">Log in to your LifePilot account</p>

      <div id="authError" class="auth-error hidden"></div>

      <form id="loginForm" autocomplete="on">
        <label for="identifier">Username or email</label>
        <input type="text" id="identifier" name="identifier" autocomplete="username" required />

        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required />

        <button type="submit" id="loginBtn">Log In</button>
      </form>

      <p class="auth-switch">Don't have an account? <a href="/signup">Sign up</a></p>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('authError');
    const btn = document.getElementById('loginBtn');

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.remove('hidden');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Logging in...';

      const identifier = document.getElementById('identifier').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier, password })
        });
        const data = await res.json();
        if (data.status === 'success') {
          window.location.href = '/';
        } else {
          showError(data.message || 'Login failed.');
        }
      } catch (err) {
        showError('Could not connect to server.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Log In';
      }
    });
  </script>
</body>
</html>
